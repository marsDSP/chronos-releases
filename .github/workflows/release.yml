name: Release build

# Dispatched by marsDSP/Chronos's beta.yml workflow (never run directly on
# a fork/PR here). Builds the private source at the given ref and publishes
# the resulting binaries as a release in THIS repo. Source is checked out
# into an ephemeral runner workspace only — never committed here.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (tag or commit SHA) in marsDSP/Chronos to build"
        required: true
      version:
        description: "Version label for the release title"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows
          - os: ubuntu-latest
            name: Linux
    steps:
      - name: Checkout Chronos source (private, transient)
        uses: actions/checkout@v4
        with:
          repository: marsDSP/Chronos
          ref: ${{ github.event.inputs.ref }}
          token: ${{ secrets.CHRONOS_SOURCE_PAT }}
          submodules: recursive

      - name: Install JUCE Linux dependencies
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends software-properties-common
          sudo add-apt-repository -y universe
          sudo apt-get update

          WEBKIT_CANDIDATES="libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev libwebkit2gtk-4.2-dev libwebkit2gtk-4.3-dev"
          WEBKIT_PKG=""
          for p in $WEBKIT_CANDIDATES; do
            if apt-cache show "$p" >/dev/null 2>&1; then
              WEBKIT_PKG="$p"
              break
            fi
          done

          if [ -z "$WEBKIT_PKG" ]; then
            echo "No libwebkit2gtk-dev package found in apt repos; aborting."
            exit 1
          fi

          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y --no-install-recommends \
            libx11-dev libxcomposite-dev libxinerama-dev libxcursor-dev \
            libxrandr-dev libxext-dev libfreetype6-dev libasound2-dev \
            libgl1-mesa-dev libglu1-mesa-dev pkg-config \
            libgtk-3-dev "$WEBKIT_PKG" libfontconfig1-dev \
            libgdk-pixbuf2.0-dev

      - name: Install modern GCC (Linux only)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-14 g++-14
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 100

      # Chronos refuses a Release configure without a future beta end date.
      # Repo variable CHRONOS_BETA_END pins one; otherwise today + 30 days.
      - name: Beta end date
        shell: bash
        run: |
          END="${{ vars.CHRONOS_BETA_END }}"
          [ -n "$END" ] || END=$(date -u -d '+30 days' +%F 2>/dev/null || date -u -v+30d +%F)
          echo "CHRONOS_BETA_END=$END" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCHRONOS_BETA_END=${{ env.CHRONOS_BETA_END }}

      - name: Build
        run: cmake --build build --config Release -j

      - name: Collect artifacts (macOS)
        if: runner.os == 'macOS'
        run: |
          cd build/Chronos_artefacts/Release
          zip -r -y "$GITHUB_WORKSPACE/Chronos-${{ github.event.inputs.version }}-macOS.zip" \
            VST3/Chronos.vst3 AU/Chronos.component Standalone/Chronos.app

      # Unsigned for now: Gatekeeper quarantines the download, so the image
      # carries a note on clearing it. Drag targets cover the system folders.
      - name: Package DMG (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          A=build/Chronos_artefacts/Release
          S="$RUNNER_TEMP/Chronos"
          mkdir -p "$S"
          cp -R "$A/VST3/Chronos.vst3" "$A/AU/Chronos.component" "$A/Standalone/Chronos.app" "$S/"
          ln -s /Library/Audio/Plug-Ins/VST3 "$S/VST3 Plug-Ins"
          ln -s /Library/Audio/Plug-Ins/Components "$S/AU Plug-Ins (Components)"
          ln -s /Applications "$S/Applications"
          cat > "$S/Install.txt" <<'EOF'
          Drag Chronos.vst3 onto "VST3 Plug-Ins", Chronos.component onto
          "AU Plug-Ins (Components)", and Chronos.app onto "Applications".

          This beta is not signed yet. If macOS or your DAW blocks it, run this
          once in Terminal, then rescan plug-ins in your DAW:

          sudo xattr -dr com.apple.quarantine /Library/Audio/Plug-Ins/VST3/Chronos.vst3 /Library/Audio/Plug-Ins/Components/Chronos.component /Applications/Chronos.app
          EOF
          hdiutil create -volname "Chronos" -srcfolder "$S" -ov -format UDZO \
            "$GITHUB_WORKSPACE/Chronos-${{ github.event.inputs.version }}-macOS.dmg"

      - name: Collect artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path build/Chronos_artefacts/Release/VST3/Chronos.vst3, `
                  build/Chronos_artefacts/Release/Standalone/Chronos.exe `
            -DestinationPath Chronos-${{ github.event.inputs.version }}-Windows.zip

      - name: Collect artifacts (Linux)
        if: runner.os == 'Linux'
        run: |
          cd build/Chronos_artefacts/Release
          zip -r -y "$GITHUB_WORKSPACE/Chronos-${{ github.event.inputs.version }}-Linux.zip" \
            VST3/Chronos.vst3 Standalone/Chronos

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chronos-${{ github.event.inputs.version }}-${{ matrix.name }}
          path: |
            Chronos-*.zip
            Chronos-*.dmg
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    # Publish whatever built; the macOS DMG is the one required asset.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls dist/Chronos-*-macOS.dmg
          gh release create "${{ github.event.inputs.version }}" dist/Chronos-* \
            --title "Chronos ${{ github.event.inputs.version }}" \
            --notes "Built from marsDSP/Chronos @ ${{ github.event.inputs.ref }}."
